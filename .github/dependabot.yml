version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ["@earendil-works/*"]
    ignore:
      # pi's types are pinned to the version the extension is tested with; bump deliberately.
      - dependency-name: "@earendil-works/*"
      # typescript-eslint supports TypeScript < 6.1 only.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Node types follow the minimum supported Node version (22), not the latest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /test/pi
    schedule:
      interval: monthly
