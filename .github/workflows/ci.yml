name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:host
      - run: npm run build
      - run: npm run check:bundle
      - name: Package contents
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path).sort();
            console.log(files.join("\n"));
            const expected = ["CHANGELOG.md", "LICENSE", "README.md", "dist/index.js", "package.json"];
            if (JSON.stringify(files) !== JSON.stringify(expected)) { console.error("unexpected package contents"); process.exit(1); }'
      - name: No runtime dependency
        run: node -e 'const p = require("./package.json"); if (Object.keys({ ...p.dependencies, ...p.peerDependencies, ...p.optionalDependencies }).length) process.exit(1)'

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ./scripts/e2e-keycloak.sh up
      - run: npm run test:e2e
      - if: failure()
        run: docker logs pi-keycloak-auth-e2e | tail -100
      - if: always()
        run: ./scripts/e2e-keycloak.sh down
