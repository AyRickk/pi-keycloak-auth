name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:host
      - run: npm run build
      - run: npm run check:bundle
      - name: Package contents
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path).sort();
            console.log(files.join("\n"));
            const expected = ["CHANGELOG.md", "LICENSE", "README.md", "dist/index.js", "package.json"];
            if (JSON.stringify(files) !== JSON.stringify(expected)) { console.error("unexpected package contents"); process.exit(1); }'
      - name: No runtime dependency
        run: node -e 'const p = require("./package.json"); const d = { ...p.dependencies, ...p.peerDependencies, ...p.optionalDependencies }; if (Object.keys(d).length) { console.error(d); process.exit(1); }'

  e2e:
    name: end-to-end (Keycloak + real pi)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: ./scripts/e2e-keycloak.sh up
      - run: npm run test:e2e
      - name: Real pi check
        run: |
          python -m pip install --quiet pyte
          python test/pi/real-pi-check.py "$RUNNER_TEMP/real-pi"
      - name: Upload pi screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pi-screens
          path: ${{ runner.temp }}/real-pi/*.txt
          if-no-files-found: ignore
      - name: Keycloak logs
        if: failure()
        run: docker logs pi-keycloak-auth-e2e 2>&1 | tail -100
      - if: always()
        run: ./scripts/e2e-keycloak.sh down
