name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.19.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:host
      - run: npm run build
      - run: npm run check:bundle
      - name: Package contents
        run: |
          npm pack --dry-run --json --ignore-scripts | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path).sort();
            console.log(files.join("\n"));
            const expected = ["CHANGELOG.md", "LICENSE", "README.md", "dist/index.js", "package.json"];
            if (JSON.stringify(files) !== JSON.stringify(expected)) { console.error("unexpected package contents"); process.exit(1); }'
      - name: No runtime dependency
        run: node -e 'const p = require("./package.json"); const d = { ...p.dependencies, ...p.peerDependencies, ...p.optionalDependencies }; if (Object.keys(d).length) { console.error(d); process.exit(1); }'

  e2e:
    name: end-to-end (Keycloak + real pi)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: ./scripts/e2e-keycloak.sh up
      - run: npm run test:e2e
      - name: Real pi check
        run: |
          python -m pip install --quiet --require-hashes -r test/pi/requirements.txt
          python test/pi/real-pi-check.py "$RUNNER_TEMP/real-pi"
      - name: Upload pi screen captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-pi-screens
          path: ${{ runner.temp }}/real-pi/*.txt
          if-no-files-found: ignore
      - name: Keycloak logs
        if: failure()
        run: docker logs pi-keycloak-auth-e2e 2>&1 | tail -100
      - if: always()
        run: ./scripts/e2e-keycloak.sh down
