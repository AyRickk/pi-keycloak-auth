name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: CHANGELOG has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:host
      - run: npm run build
      - run: npm run check:bundle
      - run: ./scripts/e2e-keycloak.sh up
      - run: npm run test:e2e
      - if: always()
        run: ./scripts/e2e-keycloak.sh down

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Must match the environment configured as trusted publisher on npmjs.com.
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
      - name: Release assets
        run: |
          mkdir -p release
          cp dist/index.js release/pi-keycloak-auth.js
          npm pack --ignore-scripts --pack-destination release
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - name: Publish to npm with provenance (trusted publishing)
        # Idempotent: a version already on npm (re-run, or published by hand) is skipped so
        # the GitHub release is still created.
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      # Draft first, attach every asset, then publish: required for immutable releases,
      # which lock a release (and its assets) as soon as it is published.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          gh release upload "$GITHUB_REF_NAME" release/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
